name: Build iPhone app

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  compile:
    name: Native app compile and regression tests
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Regression tests
        run: |
          swiftc LightRetro/Core/Models.swift LightRetro/Core/GameCatalogue.swift LightRetro/Core/FolderScanner.swift Tests/main.swift -o "$RUNNER_TEMP/library-tests"
          "$RUNNER_TEMP/library-tests"
          clang++ -std=c++17 -Wall -Wextra Tests/frame_audio.cpp -o "$RUNNER_TEMP/frame-audio-tests"
          "$RUNNER_TEMP/frame-audio-tests"
          clang++ -std=c++17 -Wall -Wextra Tests/analog_input.cpp -o "$RUNNER_TEMP/analog-tests"
          "$RUNNER_TEMP/analog-tests"
          python3 -m unittest discover -s Tests -p 'test_*.py'
      - run: brew install xcodegen
      - run: python3 ci/generate_project.py
      - name: Compile for iPhone
        run: |
          xcodebuild build -project LightRetro.xcodeproj -scheme LightRetro -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || { grep -E 'error:' build.log | sort -u | head -80; tail -50 build.log; exit 1; }
          echo 'Native app compiled successfully.'
      - name: Native simulator tests and screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if runtime.endswith("iOS-27-2") for x in items if "iPhone" in x["name"]))')
          xcodebuild test -project LightRetro.xcodeproj -scheme LightRetro -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath build/UITests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            > simulator.log 2>&1 || { grep -E 'error:|failed|Failure' simulator.log | tail -60; tail -50 simulator.log; exit 1; }
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-log
          path: |
            build.log
            simulator.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-test-results
          path: |
            build/UITests.xcresult
            build/screenshots
          if-no-files-found: ignore

  cores:
    name: Build ${{ matrix.core }} for iPhone
    runs-on: macos-15-intel
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        core: [fceumm, snes9x, genesis_plus_gx, mednafen_pce_fast, fbneo, mamearcade, mupen64plus_next]
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/select_xcode.sh
      - name: Identify engine build cache
        id: recipe
        run: python3 ci/core_cache_key.py '${{ matrix.core }}' >> "$GITHUB_OUTPUT"
      - name: Restore compiled core
        id: cache
        uses: actions/cache@v4
        with:
          path: Frameworks/${{ matrix.core }}.framework
          key: ${{ steps.recipe.outputs.key }}
      - name: Build pinned source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 ci/build_core.py '${{ matrix.core }}' > core.log 2>&1 || { tail -100 core.log; exit 1; }
          tail -3 core.log
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.core }}
          path: Frameworks/${{ matrix.core }}.framework
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-log-${{ matrix.core }}
          path: core.log
          if-no-files-found: ignore

  package:
    name: Verify complete iPhone app
    needs: [compile, cores]
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      INCLUDE_CORES: '1'
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: build/core-artifacts
      - run: python3 ci/collect_cores.py
      - run: brew install xcodegen
      - run: python3 ci/generate_project.py
      - name: Build with every bundled engine
        run: |
          xcodebuild build -project LightRetro.xcodeproj -scheme LightRetro -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO \
            > package.log 2>&1 || { grep -E 'error:' package.log | sort -u | head -80; tail -40 package.log; exit 1; }
          python3 ci/verify_bundle.py build/DerivedData/Build/Products/Release-iphoneos/LightRetro.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-log
          path: package.log

  testflight:
    name: Sign and upload to TestFlight
    needs: package
    # Release only by manual dispatch, or an explicitly approved merge commit
    # on protected main. The token is deliberately specific to this release.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.testflight) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, '[testflight-ios27-20261121]'))
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      INCLUDE_CORES: '1'
      BUILD_NUMBER: ${{ github.run_number }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signing key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 ci/prepare_signing.py
      - run: xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: build/core-artifacts
      - run: python3 ci/collect_cores.py
      - run: brew install xcodegen
      - run: python3 ci/generate_project.py
      - name: Archive
        run: |
          # Hosted Macs are disposable. Use a temporary ad-hoc signature here;
          # exportArchive replaces it with Apple's cloud distribution signature.
          # This avoids creating development certificates whose private keys
          # would disappear with the runner, and never revokes account certificates.
          xcodebuild archive -project LightRetro.xcodeproj -scheme LightRetro -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/LightRetro.xcarchive \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic \
            > archive.log 2>&1 || { grep -E 'error:' archive.log | sort -u | head -80; tail -50 archive.log; exit 1; }
          python3 ci/verify_bundle.py build/LightRetro.xcarchive/Products/Applications/LightRetro.app --signed
      - name: Export and upload
        run: |
          xcodebuild -exportArchive -archivePath build/LightRetro.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || { grep -E 'error:|Error' export.log | sort -u | head -80; tail -50 export.log; exit 1; }
          echo 'Uploaded to App Store Connect. Apple must process the build before it appears in TestFlight.'
      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/light-retro-keys"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signing-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
